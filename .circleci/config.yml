version: 2.1

# Define the jobs we want to run for this project
jobs:
  test:
    docker:
      - image: cimg/php:7.4
    steps:
      - checkout
      - run: php --version
      - run: sudo apt-get install libxslt1-dev

      - run:
          name: Install PHP Extensions
          command: sudo -E install-php-extensions xsl xdebug zip intl && sudo docker-php-ext-enable xdebug

      - run: echo -e "[Date]\ndate.timezone = Europe/Paris" | sudo tee /usr/local/etc/php/php.ini > /dev/null
      - run: echo -e "memory_limit = -1" | sudo tee -a /usr/local/etc/php/conf.d/docker-php-memlimit.ini

      # composer require
      - run: composer require --dev phpunit/phpunit ^5
      - run: composer require --dev php-coveralls/php-coveralls ^1
      - run: composer require --dev atoum/atoum ^3

      # composer cache
      - restore_cache:
          keys:
          # "composer.json" can be used if "composer.json"
          # is not committed to the repository.
          - composer-v1-{{ checksum "composer.lock" }}
          # fallback to using the latest cache if no exact match is found
          - composer-v1-
      - run: composer install -n --prefer-dist
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor

      # tests
      - run: php vendor/bin/phpunit Tests/phpunit -c phpunit.xml.dist
      - run: php vendor/bin/atoum -d Tests/atoum

# Orchestrate our job run sequence
workflows:
  workflow:
    jobs:
      - test
