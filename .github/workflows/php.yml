name: PHP Composer

on:
  push:
    branches: [ "7.x" ]
  pull_request:
    branches: [ "7.x" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 7.4
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install php-coveralls dev
      run: composer require --dev --update-with-all-dependencies php-coveralls/php-coveralls

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run phpunit test
      run: composer unittest

    - name: Run phpunit test with junit
      run: composer junittest

    - name: Run psalm
      run: ./vendor/bin/psalm --config=psalm.xml.dist --no-cache --no-file-cache --shepherd

    #- name: npm install, make test-coverage
    #  run: |
    #    npm install
    #    make test-coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload Scrutinizer coverage
      uses: sudo-bot/action-scrutinizer@latest
      with:
          cli-args: "--format=php-clover build/logs/clover.xml"

    - name: Coveralls
      uses: coverallsapp/github-action@v2
